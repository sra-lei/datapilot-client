           C 267 198 314 245 404 256
           C 314 267 267 314 256 404
           C 245 314 198 267 108 256
           C 198 245 245 198 256 108 Z"
        fill="#ffffff"/>
  <!-- 中心点：聚焦 / 视点 -->
  <circle cx="256" cy="256" r="34" fill="#667eea"/>
  <circle cx="256" cy="256" r="15" fill="#ffffff"/>
</svg>
