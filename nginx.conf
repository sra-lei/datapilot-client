server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS resolver：nginx 启动时不解析上游主机名，运行时动态解析
    # 避免后端容器未就绪时导致 nginx 启动硬失败
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/v1/stats/eval {
        # 评估报告接口由 Core 提供（不依赖 RAG）
        set $eval_upstream http://datapolit-core:3002/core/stats/eval;
        proxy_pass $eval_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /core/ {
        set $core_upstream http://datapolit-core:3002/;
        proxy_pass $core_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/v1/ {
        set $rag_upstream http://datapolit-rag:8000/api/v1/;
        proxy_pass $rag_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
        # 后端不可用时返回友好提示，避免浏览器 502 白屏
        error_page 502 503 504 = @rag_down;
    }

    location @rag_down {
        default_type application/json;
        return 200 '{"status":"error","message":"RAG 服务暂不可用，请稍后再试"}';
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
