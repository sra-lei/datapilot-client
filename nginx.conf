server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS resolver：nginx 启动时不解析上游主机名，运行时动态解析
    # 避免后端容器未就绪时导致 nginx 启动硬失败
    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Core 服务反代：proxy_pass 不带 URI，保留完整 /core/ 前缀
    location /core/ {
        set $core_upstream http://datapolit-core:3002;
        proxy_pass $core_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # RAG 服务反代（旧 CharterMate，兼容保留）：proxy_pass 不带 URI，保留完整 /api/v1/ 前缀
    location /api/v1/ {
        set $rag_upstream http://datapolit-rag:8000;
        proxy_pass $rag_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;
        # 后端不可用时返回友好提示，避免浏览器 502 白屏
        error_page 502 503 504 = @rag_down;
    }

    location @rag_down {
        default_type application/json;
        return 200 '{"status":"error","message":"RAG 服务暂不可用，请稍后再试"}';
    }

    # Docs-Seeker 服务反代（RAG 检索问答，8001）：保留完整 /v1/ 前缀
    # 注意：docs-seeker 容器需加入 datapolit-shared 网络，且容器名/别名解析为 datapolit-docs-seeker
    location /v1/ {
        set $docsseeker_upstream http://datapolit-docs-seeker:8001;
        proxy_pass $docsseeker_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_next_upstream off;
        # 后端不可用时返回友好提示，避免浏览器 502 白屏
        error_page 502 503 504 = @docsseeker_down;
    }

    location @docsseeker_down {
        default_type application/json;
        return 200 '{"status":"error","message":"Docs-Seeker 服务暂不可用，请稍后再试"}';
    }

    # Doc-Kit 服务反代：保留完整 /doc-kit/ 前缀（服务端按方案 B 路由）
    location /doc-kit/ {
        set $dockit_upstream http://datapolit-dockit:8100;
        proxy_pass $dockit_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件上传：Client Body 300MB，缓冲关闭（流式转发）
        client_max_body_size 300m;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        # ingest 是异步提交很快，但大文件上传要给足带宽时间
        proxy_read_timeout 300s;
        proxy_next_upstream off;
        error_page 502 503 504 = @dockit_down;
    }

    location @dockit_down {
        default_type application/json;
        return 200 '{"status":"error","message":"文档入库服务暂不可用，请稍后再试"}';
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
